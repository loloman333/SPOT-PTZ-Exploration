# -----------------------------------------------------------------------------
# Common parameters
# -----------------------------------------------------------------------------
/**: 
  ros__parameters:
    pkg_name: ptz_exploration_core
    robot_name: spotty

    # Topic suffix patterns for Spot's naming convention.
    camera_info_pattern: '/{robot}/camera/{camera}/camera_info'
    image_pattern: '/{robot}/camera/{camera}/image'
    depth_pattern: '/{robot}/depth/{camera}/image'
    points_pattern: '/{robot}/depth_registered/{camera}/points'

    use_sim_time: false

# -----------------------------------------------------------------------------
# Launch toggles
# -----------------------------------------------------------------------------
launch:
  ros__parameters:

    # Enable or disable major subsystems for hardware runs.
    launch_octomap: true
    launch_nav2: true
    launch_explorer: false
    launch_detector: true
    launch_gazer: true
    launch_optimizer: true
    launch_collector: true

    # Nav2 bringup for Spot defaults.
    nav2_config: 'nav2_params_spot.yaml'
    nav2_namespace: ''

    # Remap the generic cmd_vel interface to the Spot base controller topic.
    remappings:
      '/cmd_vel' : '/spotty/cmd_vel'

# -----------------------------------------------------------------------------
# Detector
# -----------------------------------------------------------------------------
detector: 
  ros__parameters:

    # YOLO model and inference device.
    yolo_model: yolo26n.pt
    yolo_device: cuda:0
    confidence_threshold: 0.38
    # Classes to keep from the detector output.
    target_classes:
      # - backpack
      # - laptop
      # - chair
      # - person
      - potted plant
    detection_frequency: 0.0  # per camera Hz (inferences per second) 0: no throttling

    # Spot camera stream(s) to process.
    cameras:
      - ptz

    output_pattern: '/{robot}/detection/{camera}'
    publish_annotated_image: true

# -----------------------------------------------------------------------------
# Gazer / PTZ control
# -----------------------------------------------------------------------------
gazer:
  ros__parameters:
    # PTZ source camera on Spot.
    camera: ptz

    # Frame conventions used by the PTZ control node.
    ptz_origin_frame: spotty/ptz_origin
    gaze_frame: spotty/vision
    world_frame: spotty/vision
    base_frame: spotty/base_link

    # Core command and feedback topics.
    ptz_cmd_topic: /ptz_cmd
    ptz_state_topic: /ptz_state
    ptz_settled_topic: /ptz_settled
    target_point_topic: /clicked_point
    octomap_topic: /octomap_binary
    landmarks_topic: /landmarks
    detections_topic: /detections

    octomap_min_translation_m: 0.1
    octomap_min_rotation_rad: 0.09
    octomap_update_interval: 1.0
    landmark_dismiss_radius_m: 1.2
    scan_num_stops: 5
    scan_dwell_time_s: 4.0
    scan_home_tolerance_rad: 0.05
    scan_home_tolerance_zoom: 0.05
    scan_zoom: 1.0
    confirm_threshold: 0.65
    turning_direction: -1
    home_pan_offset_rad: -0.6283185
    home_tilt_offset_rad: 0.0
    home_zoom_offset: 0.0

# -----------------------------------------------------------------------------
# Point cloud aggregation
# -----------------------------------------------------------------------------
cloud_in:
  ros__parameters:
    # Downsampling and range limits for Spot camera point clouds.
    downsample_factor: 100
    max_range_m: 3.0
    max_z_m: 1.5
    cameras:
      - frontleft
      - frontright
      - back
      - left
      - right

# -----------------------------------------------------------------------------
# Detection projection
# -----------------------------------------------------------------------------
projector:
  ros__parameters:
    # Project detections using the PTZ camera only.
    cameras:
      - ptz

    world_frame: spotty/vision # TODO
    base_frame: spotty/feet_center

    detections_topic: /detections
    octomap_topic: /octomap_full
    detection_measurements_topic: /detection_measurements
    detection_debug_markers_topic: /detection_debug_markers

    max_ray_distance: 50.0
    bbox_center_confidence_multiplier: 2.8
    min_bearing_sigma_rad: 0.09
    range_sigma_multiplier: 0.8
    min_range_sigma_m: 0.06

    octomap_min_translation_m: 0.1
    octomap_min_rotation_rad: 0.09
    octomap_update_interval: 1.0

# -----------------------------------------------------------------------------
# Landmark optimizer
# -----------------------------------------------------------------------------
optimizer:
  ros__parameters:

    world_frame: spotty/vision
    landmarks_topic: /landmarks

    # Camera model source for FoV gating in data association
    cameras:
      - ptz

    # Triangulation
    triangulation_min_pose_baseline_m: 0.25
    triangulation_min_parallax_threshold: 0.02
    triangulation_max_ray_distance_m: 0.25
    triangulation_min_depth_m: 1.5 

    # Data association
    data_association_alpha: 0.95
    candidate_confirmation_threshold: 4

    # Message filtering
    similar_pose_translation_threshold_m: 0.25
    similar_time_threshold: 0.25

    # Graph / solver
    pose_prior_pos_sigma_m: 0.01
    pose_prior_rot_sigma_rad: 0.001
    isam_relinearize_threshold: 0.1
    isam_relinearize_skip: 1
    export_factor_graph: false
    factor_graph_export_path: ~/ros2_ws/data/factor_graph/current_run.json

# -----------------------------------------------------------------------------
# Exploration / navigation
# -----------------------------------------------------------------------------
explorer:
  ros__parameters:
    # Frames used by frontier exploration.
    base_frame_id: spotty/base_link
    map_frame_id: map

    explore_period_s: 1.0
    blacklist_radius_m: 1.0
    min_goal_distance_from_robot_m: 0.4

    min_frontier_size_cells: 10
    weight_cells: 0.2
    weight_distance: 1.0

    occupied_threshold: 50
    min_frontier_size_cells: 10
    weight_cells: 0.2
    weight_distance: 1.0
    distance_type: euclidean # options: euclidean, path_length

    projected_map_topic: /projected_map
    frontier_map_topic: /frontier_map
    frontier_markers_topic: /frontier_markers # TODO: remove ?
    blacklisted_markers_topic: /blacklisted_goal_markers # TODO: remove ?
    scan_service_name: /scan_environment
    confirm_service_name: /confirm_landmarks

    confirm_landmarks: false
    scan_method: ptz_service # options: ptz_service, body_rotation, none
    scan_num_stops: 6
    scan_dwell_time_s: 2.0
    body_scan_cmd_vel_topic: /spotty/cmd_vel

# -----------------------------------------------------------------------------
# Run data collector
# -----------------------------------------------------------------------------
collector:
  ros__parameters:
    # Spot run metadata used for saved datasets.
    robot_name: spotty
    base_frame_id: spotty/base_link
    reference_frame_id: spotty/vision
    sim_world_name: ''
    distance_update_hz: 5.0
    landmarks_topic: /landmarks
    projected_map_topic: /projected_map
    output_dir: ~/ros2_ws/data/collector_runs
    target_objects: 4

# -----------------------------------------------------------------------------
# OctoMap server
# -----------------------------------------------------------------------------
octomap_server:
  ros__parameters:

    latch: false
    colored_map: false
    height_map: false

    base_frame_id: spotty/feet_center
    frame_id: spotty/vision
    
    filter_ground_plane: true
    ground_filter:
      angle: 0.15
      distance: 0.28 #0.25
      plane_distance: 0.23 #0.2
    
    occupancy_max_z: 3.0
    occupancy_min_z: -1.0
    # point_cloud_max_z: 5.0
    # point_cloud_min_z: -2.0
    resolution: 0.17 # 0.1

    sensor_model:
      hit: 0.55
      max: 0.8
      max_range: 2.5
      min: 0.1
      miss: 0.1